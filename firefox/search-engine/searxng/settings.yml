# Linden Search: self-hosted metasearch configuration.
# keep_only is intentional: Google, Bing and every unlisted engine are excluded.
use_default_settings:
  engines:
    keep_only:
      - brave
      - brave.images
      - brave.news
      - brave.videos
      - wikipedia
      - wikinews

general:
  debug: false
  instance_name: "Linden Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  image_proxy: true

ui:
  default_locale: "es"
  theme_args:
    simple_style: auto
