name: Linden Firefox foundation checks

on:
  push:
    branches: [firefox]
    paths:
      - "firefox/**"
      - ".github/workflows/firefox-foundation.yml"
  pull_request:
    paths:
      - "firefox/**"
      - ".github/workflows/firefox-foundation.yml"

jobs:
  validate-newtab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Linden Search gateway syntax
        run: node --check firefox/search-engine/gateway/server.mjs && node --check firefox/search-engine/gateway/crawler.mjs
      - name: Validate Firefox start page and search configuration
        run: node --test firefox/tests/*.test.mjs
